apiVersion: v1
kind: ConfigMap
metadata:
  name: controlplane-config
  namespace: edc-v
data:
  # base config
  edc.hostname: "controlplane.edc-v.svc.cluster.local"
  edc.vault.hashicorp.url: "http://vault.edc-v.svc.cluster.local:8200"
  edc.vault.hashicorp.token: "root"
  edc.participant.id: "did:web:connector"
  edc.iam.did.web.use.https: "false"
  edc.iam.credential.revocation.mimetype: "application/json"

  # web config
  web.http.port: "8080"
  web.http.path: "/api"
  web.http.protocol.port: "8082"
  web.http.protocol.path: "/api/dsp"
  web.http.protocol.virtual: "true"
  web.http.management.port: "8081"
  web.http.management.path: "/api/mgmt"
  web.http.control.port: "8083"
  web.http.control.path: "/api/control"

  # NATS config
  edc.nats.cn.subscriber.url: "nats://nats.edc-v.svc.cluster.local:4222"
  edc.nats.cn.subscriber.autocreate: "true"
  edc.nats.cn.publisher.url: "nats://nats.edc-v.svc.cluster.local:4222"
  edc.nats.tp.subscriber.url: "nats://nats.edc-v.svc.cluster.local:4222"
  edc.nats.tp.subscriber.autocreate: "true"
  edc.nats.tp.publisher.url: "nats://nats.edc-v.svc.cluster.local:4222"

  # dataplane config
  edc.datasource.default.url: "jdbc:postgresql://postgres.edc-v.svc.cluster.local:5432/controlplane"
  edc.datasource.default.user: "cp"
  edc.datasource.default.password: "cp"
  edc.sql.schema.autocreate: "true"

  edc.encryption.aes.key.alias: "aes-key-alias"

  # Oauth2 config
  edc.iam.oauth2.issuer: "http://keycloak.edc-v.svc.cluster.local:8080/realms/edcv"
  edc.iam.oauth2.jwks.url: "http://keycloak.edc-v.svc.cluster.local:8080/realms/edcv/protocol/openid-connect/certs"

  # General membership — DEFAULT, every participant has MembershipCredential
  # so authentication always succeeds regardless of dataspace
  edc.iam.dcp.scopes.membership.id: "membership-scope"
  edc.iam.dcp.scopes.membership.type: "DEFAULT"
  edc.iam.dcp.scopes.membership.value: "org.eclipse.dspace.dcp.vc.type:MembershipCredential:read"

  # Catena-X specific membership — POLICY, only requested when asset policy requires it
  edc.iam.dcp.scopes.catenamembership.id: "catena-membership-scope"
  edc.iam.dcp.scopes.catenamembership.type: "POLICY"
  edc.iam.dcp.scopes.catenamembership.value: "org.eclipse.dspace.dcp.vc.type:CatenaMembershipCredential:read"
  edc.iam.dcp.scopes.catenamembership.prefix-mapping: "CatenaMembershipCredential"

  # Bike-X specific membership — POLICY, only requested when asset policy requires it
  edc.iam.dcp.scopes.bikemembership.id: "bike-membership-scope"
  edc.iam.dcp.scopes.bikemembership.type: "POLICY"
  edc.iam.dcp.scopes.bikemembership.value: "org.eclipse.dspace.dcp.vc.type:BikeMembershipCredential:read"
  edc.iam.dcp.scopes.bikemembership.prefix-mapping: "BikeMembershipCredential"

  # Catena-X manufacturer — POLICY
  edc.iam.dcp.scopes.manufacturer.id: "manufacturer-scope"
  edc.iam.dcp.scopes.manufacturer.type: "POLICY"
  edc.iam.dcp.scopes.manufacturer.value: "org.eclipse.dspace.dcp.vc.type:CatenaManufacturerCredential:read"
  edc.iam.dcp.scopes.manufacturer.prefix-mapping: "ManufacturerCredential"

  # Bike-X manufacturer — POLICY
  edc.iam.dcp.scopes.bikemanufacturer.id: "bike-manufacturer-scope"
  edc.iam.dcp.scopes.bikemanufacturer.type: "POLICY"
  edc.iam.dcp.scopes.bikemanufacturer.value: "org.eclipse.dspace.dcp.vc.type:BikeManufacturerCredential:read"
  edc.iam.dcp.scopes.bikemanufacturer.prefix-mapping: "BikeManufacturerCredential"

  # Trusted Issuers
  edc.iam.trustedissuer.issuer.id: "did:web:issuerservice.edc-v.svc.cluster.local%3A10016:issuer"
  edc.iam.trustedissuer.issuer.supportedtypes: '["MembershipCredential","CatenaMembershipCredential","CatenaManufacturerCredential","BikeMembershipCredential","BikeManufacturerCredential"]'
  edc.iam.trustedissuer.issuer.properties: "{}"

  JAVA_TOOL_OPTIONS: "-agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=1044"